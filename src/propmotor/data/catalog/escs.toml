# Candidate ESCs (collected 2026-11). All accept standard servo PWM (the 1585 outputs 50 Hz, 1000-2000 us).
# cells_min / cells: LiPo cell range; v_min = 3.0 V * cells_min, v_max = 4.2 V * cells_max.
# jp_available: confirmed purchasable in Japan. needs_soldering: bare board (excluded by default).
# motor_bullet_mm: bullets fitted on the motor side (no soldering). battery_connector: XT60/Deans/bare (bare -> lever connector).
# regen_control: can active braking / active freewheeling (damped light, complementary PWM) be turned OFF?
#   matters with a lab supply that cannot sink current (PWR401L).

