[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "propmotor"
version = "0.1.0"
description = "Propeller / motor / ESC / power-source matching and selection for static (hover) thrust tests"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
notebook = ["ipykernel", "ipywidgets"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
propmotor = ["data/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
